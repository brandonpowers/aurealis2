name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libfftw3-dev

      - name: Configure
        run: cmake --preset default

      - name: Build
        run: cmake --build build -j2

      - name: Test
        run: ctest --test-dir build --output-on-failure

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: brew install cmake fftw

      - name: Configure
        run: cmake --preset default

      - name: Build
        run: cmake --build build -j2

      - name: Test
        run: ctest --test-dir build --output-on-failure

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake --preset default

      - name: Build
        run: cmake --build build --config Debug

      - name: Test
        run: ctest --test-dir build --output-on-failure -C Debug

  visual-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install node dependencies
        run: npm ci

      - name: Generate reference audio
        run: bash Aurealis2/scripts/gen-test-audio.sh

      - name: Serve web directory
        run: nohup python3 -m http.server 8080 --directory Aurealis2/resources/web > server.log 2>&1 &

      - name: Wait for server
        run: curl --retry 10 --retry-connrefused --retry-delay 1 -s -o /dev/null http://localhost:8080/index.html

      - name: Run visual checkpoint tests
        run: mkdir -p visual-out && node Aurealis2/scripts/run-visual-tests.mjs --out visual-out

      - name: Upload checkpoint screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-checkpoints
          path: visual-out/*.png
